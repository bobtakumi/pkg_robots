# pkg_robots 設定（実装プラン §1.1）
[vault]
path = "/Users/bobtk/pkg_vault"
# インデックス対象から除外するパス（前方一致 or パス断片）
exclude_prefixes = ["_depot/", "9_Templates/", "plan/", "_Reports/", ".obsidian/", ".trash/"]
exclude_fragments = ["/Assets/"]

[index]
db_path = "data/garden.db"
stats_path = "data/stats.json"
# 日本語+markdown はトークン膨張が激しい（実測: 3450字が bge-m3 の 8192tok を超過）。
# 節ノート中央値 2.3k字 → 2000字は粒度として妥当
chunk_max_chars = 2000

[embed]
# 【O1 決着 2026-07-04】埋め込みは MBP（M3 Max・128GB）でホスト。DGX は判定専用（--embeddings なし=501）。
# 想定配置: pkg_robots 本体も MBP で稼働 → 埋め込みは MBP ローカル（localhost）、判定は DGX へ。
#   pkg_robots を Neo 等の別マシンで動かす場合のみ endpoint を "http://<MBPのホスト名>:11434" に変える。
# 現 data/garden.db は Neo プロトタイプの bge-m3-8k で構築済み。MBP 移設後に再インデックスで再現する。
# 不達なら埋め込みパスは自動スキップ。
# O2 決着（2026-07-03）: bge-m3-8k 採用（recall@10=51.1% / @30=63.8%。ruri-large 25.5% に優越）
endpoint = "http://localhost:11434"
# 非対称モデル用 prefix（ruri 等）。bge-m3 は不要なので空
model = "bge-m3-8k"
query_prefix = ""
passage_prefix = ""

[judge]
# DGX Spark 上の llama.cpp llama-server（OpenAI 互換 /v1、認証なし）。2026-07-04 実測確定。
# thinking モデルだが llama.cpp は推論を reasoning_content に分離し content は素の JSON を返す。
endpoint = "http://spark-062c.local:11434/v1"
model = "llm-jp-4-32b-a3b-thinking-Q4_K_M.gguf"

[report]
# M6 回帰（2026-07-04）で LLM-jp-4 の過剰リンク傾向が判明（非gold link 11/15）。
# 誤リンクは conf4〜5 に集中するため conf>=5 でゲート（偽 11→2 / 正 17→9）。
# precision 優先（週5件の提案なので recall より誤提案を減らす方が価値が高い）。
min_confidence = 5

[sheet]
# 週次判定シート1枚あたりの提案数上限（7/11 設計「目安15分で返せる量」）。
# 上限を超えた提案は保留として proposals.jsonl に残り、次回のシートへ持ち越す。
max_proposals = 5

[rules]
# 規則ベース提案（R4）。1枚のシートに確保する枠と、1回に作る提案数の上限。
# 昇格候補は棚卸し直後に数十件出るので、週次では少数ずつ返してもらう（少数・非一括の原則）。
sheet_quota = 2
max_status = 20
max_tag = 20
max_queue = 10
max_moc = 10

[moc]
# タグ → その主題を集めている MOC。2026-08-03 に既存11本の MOC の収録実態から導いた
# （各タグについて、そのタグを持つノートが最も多く載っている MOC を採用）。
# 一致率: AIBPR 93% / project/TCALab 86% / KM 86% / BuJo 81% / AIEng 80% / Career 80% /
#         PKG 65% / Emergence 62% / Driver 53%、Recovery・Unblock・PJOps・GPU-sensei は 100%。
# Driver だけは MOC_Mindset と MOC_キャリアデザイン に割れているので、提案の当たりは弱い。
# MOC を新設・改名したらこの表も直す（機械では追えない）。
[moc.map]
PKG = "MOC_PKG運用"
Emergence = "MOC_自発的発展"
BuJo = "MOC_タスクの進め方"
Recovery = "MOC_タスクの進め方"
Unblock = "MOC_手が止まった時のアイデア"
Driver = "MOC_Mindset"
Career = "MOC_キャリアデザイン"
PJOps = "MOC_AI駆動開発"
AIEng = "MOC_AIEng"
AIBPR = "MOC_AI駆動開発"
KM = "MOC_組織KM"
"project/TCALab" = "MOC_TCALab"
"project/GPU-sensei" = "MOC_GPU教科書"

[lint]
# タグ統制語彙（2026-08-02「成熟度とタグの運用基準（確定）」の15種）。
# 主題軸11 + 活動軸 project/ 2 + 出典軸 source/ 2。語彙の増減は運用基準の改訂とセットで行う。
allowed_tags = [
  "PKG", "Emergence", "BuJo", "Recovery", "Unblock", "Driver", "Career",
  "PJOps", "AIEng", "AIBPR", "KM",
  "project/TCALab", "project/GPU-sensei",
  "source/management", "source/client",
]
# wikilink の解決を検査する対象（未解決は「起票待ちキュー」として別枠表示・エラーにしない）
link_scope = ["2_Permanent/", "1_Literature/"]

[candidates]
# 実測（gold=6/26 レポート確度高47件）: recall@10=51.1% / recall@30=63.8%。
# 候補段は recall 重視で 30 に設定し、絞り込みは judge（M3）が担う。
# 残る深い miss（語彙が重ならない概念的接続 ≈36%）は Phase 2 GraphRAG / ハイブリッド検索の領域
top_k = 30
min_similarity = 0.45
